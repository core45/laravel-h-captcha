name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - Livewire ${{ matrix.livewire }} (full stack)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        # Livewire 4 only: every filament/support 5.x release requires
        # livewire/livewire ^4.1, so a Livewire 3 leg with Filament installed
        # cannot resolve. Livewire 3 is covered by the livewire-3 job below,
        # which drops Filament.
        livewire: ['4']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies (base)
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-install"

      - name: Require matrix versions
        run: |
          # laravel/framework replaces every illuminate/* package, so requiring
          # the split packages by version alongside it cannot resolve. Testbench
          # pulls the framework in, so the framework constraint is what pins the
          # Laravel version under test.
          composer require --no-update --dev \
            "laravel/framework:^${{ matrix.laravel }}.0"
          composer require --no-update --dev \
            "livewire/livewire:^${{ matrix.livewire }}.0" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Update dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run core test suites (Unit, Feature, Octane)
        run: composer test:core

      - name: Run Integration tests
        run: composer test:integration

  core-only:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} (core only, no Livewire/Filament)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies (base)
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-install"

      - name: Require matrix versions and drop optional integrations
        run: |
          # laravel/framework replaces every illuminate/* package, so requiring
          # the split packages by version alongside it cannot resolve. Testbench
          # pulls the framework in, so the framework constraint is what pins the
          # Laravel version under test.
          composer require --no-update --dev \
            "laravel/framework:^${{ matrix.laravel }}.0"
          composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
          # The point of this job: the package must work with neither optional
          # integration installed. Only the core suites run here.
          composer remove --no-update --dev livewire/livewire filament/filament

      - name: Update dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run core test suites (Unit, Feature, Octane) with no Livewire/Filament
        run: composer test:core

  livewire-3:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - Livewire 3 (no Filament)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies (base)
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-install"

      - name: Pin Livewire 3 and drop Filament
        run: |
          # laravel/framework replaces every illuminate/* package, so requiring
          # the split packages by version alongside it cannot resolve. Testbench
          # pulls the framework in, so the framework constraint is what pins the
          # Laravel version under test.
          composer require --no-update --dev \
            "laravel/framework:^${{ matrix.laravel }}.0"
          composer require --no-update --dev \
            "livewire/livewire:^3.6" \
            "orchestra/testbench:${{ matrix.testbench }}"
          # Filament 5 requires livewire/livewire ^4.1, so Livewire 3 can only
          # be covered without it. That is the honest shape of the support
          # claim: Livewire 3 works, Livewire 3 plus Filament 5 cannot install.
          composer remove --no-update --dev filament/filament

      - name: Update dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run core test suites (Unit, Feature, Octane)
        run: composer test:core
